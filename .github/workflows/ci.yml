name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: storm
          POSTGRES_PASSWORD: storm
          POSTGRES_DB: storm
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # MySQL and MariaDB are runtime targets: storm generates for both and
      # executes against both through runtime/mydrv. Two services rather than
      # one, because the dialects DIFFER — the MariaDB-generated package is a
      # syntax error on MySQL 8 — so a single server would leave half the
      # generator untested.
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: storm
          MYSQL_DATABASE: storm
          MYSQL_USER: storm
          MYSQL_PASSWORD: storm
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -ustorm -pstorm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: storm
          MARIADB_DATABASE: storm
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      STORM_DSN: postgres://storm:storm@localhost:5432/storm
      # The adapter's live tests read these. Without them the whole of
      # runtime/mydrv skips, and "the tests pass" would mean the unit half.
      STORM_MYSQL_ADDR: 127.0.0.1:3306
      STORM_MARIADB_ADDR: 127.0.0.1:3307
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: vet
        run: go vet ./...

      # AGENTS.md's rules are only real if something enforces them.
      - name: boundaries
        run: ./scripts/check/boundaries.sh

      # Every other gate runs inside this repository and shares its
      # assumptions, which is how `generate` shipped emitting storm's own
      # module path into other people's modules. This one is a stranger: a
      # different module path, a directory outside the tree, a model storm has
      # never seen, and the five-line main a real user writes.
      #
      # With STORM_DSN set (this job has one) it also walks the migration
      # path — diff, apply with a runner of its own, verify — which is the
      # riskiest thing an ORM does and had only ever been exercised from
      # inside this module.
      - name: outsider
        run: ./scripts/check/outsider.sh

      # -race catches the shape cache and binder pool; -shuffle catches tests
      # that only pass in declaration order.
      - name: test
        run: go test -race -shuffle=on ./...

      # Not a perf gate: it fails only if a benchmark stops compiling or
      # errors, which is how benchmark rot usually starts.
      # The worked service: a SEPARATE module, so `go test ./...` above cannot
      # reach it. It is the only end-to-end proof of aggregations, joins, CTEs,
      # full-text search, ranges and the typed constraint errors — 34 tests
      # against a real server. Left out of CI it would rot within a release.
      - name: the orders example
        working-directory: examples/orders
        run: |
          go mod tidy
          go run ../../cmd/storm generate store
          # vet, because this is the only module in the repository that holds a
          # generated shape assertion and the root `go vet ./...` cannot reach
          # it. That gap let storm emit code failing vet from v0.3.0 to v0.6.2.
          go vet ./...
          go test -race ./orders/

      # Every statement the generated code can issue, planned by the server.
      # This is the only gate for "storm emitted SQL PostgreSQL rejects" — a
      # declared aggregation or join nobody wrote a test for has its SQL fixed
      # at generate time, so it is valid or it is a production error. Breaking
      # the HAVING lowering by one keyword is caught here and nowhere else.
      # The rest of the reasoning, including why lint is not run, is in the
      # script.
      #
      # psql is installed explicitly rather than assumed, for the same reason
      # the MySQL client below is: the script FAILS when it is missing, so
      # relying on whatever the runner image ships would make this step's
      # outcome depend on an image update nobody here controls.
      - name: every statement plans
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          ./scripts/check/explain.sh

      # storm emits MySQL DDL and reports what does not port. A golden test
      # proves the generator is consistent with itself; it cannot prove the SQL
      # is valid — which is how `DEFAULT  NOT NULL` shipped past every unit
      # test and failed on MySQL's first line. This applies it.
      - name: mysql ddl and portability
        env:
          STORM_MYSQL_DSN: "storm:storm@tcp(127.0.0.1:3306)/storm"
        # The client is installed explicitly rather than assumed: the check
        # FAILS when it is missing (a gate that skips itself is not a gate), so
        # relying on whatever the runner image happens to ship would make this
        # step's outcome depend on an image update nobody here controls.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client
          ./scripts/check/mysql.sh

      # A separate gate, not a flag on the one above, because the point is that
      # the two dialects DIFFER: MariaDB has INSERT ... RETURNING and has not
      # got LATERAL, GROUPING(), ordered WITH ROLLUP or FOR SHARE. A gate that
      # ran the shared four fifths twice would prove nothing about the fifth.
      - name: mariadb dialect
        env:
          STORM_MARIADB_DSN: "127.0.0.1:3307"
        run: ./scripts/check/mariadb.sh

      - name: benchmarks compile and run
        run: go test -run XXX -bench . -benchtime=1x ./bench/

      # The seed corpus runs as an ordinary test above; this is the part that
      # searches. Short on every PR because a fuzzer that only runs nightly
      # finds its bugs a day after the commit that caused them.
      #
      # It has already earned this: 20 seconds found a stream whose WHERE
      # clause was silently dropped while NArg still counted the dropped
      # predicates — a filter that failed OPEN.
      - name: fuzz the compiler
        run: |
          go test ./runtime/ -run XXX -fuzz FuzzSpliceTree -fuzztime 60s
          go test ./runtime/ -run XXX -fuzz FuzzSpliceSections -fuzztime 30s
          go test ./compile/pgsql/ -run XXX -fuzz FuzzIdent -fuzztime 30s

      # A REACHABLE vulnerability fails the build; "required but not called"
      # is reported and tolerated (Ent's toolchain drags modules nothing here
      # executes). The first run of this found x/text's norm reachable through
      # pgx's SCRAM path on every connect — found by scanning, not by luck.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # Coverage floors, per profile, from AGENTS.md. A floor rather than a
      # target: it stops coverage falling silently, and says nothing about
      # whether the tests are good.
      - name: coverage floors
        run: ./scripts/check/coverage.sh
