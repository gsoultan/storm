name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: raorm
          POSTGRES_PASSWORD: raorm
          POSTGRES_DB: raorm
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RAORM_DSN: postgres://raorm:raorm@localhost:5432/raorm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: vet
        run: go vet ./...

      # AGENTS.md's rules are only real if something enforces them.
      - name: boundaries
        run: ./scripts/check/boundaries.sh

      # Every other gate runs inside this repository and shares its
      # assumptions, which is how `generate` shipped emitting raorm's own
      # module path into other people's modules. This one is a stranger: a
      # different module path, a directory outside the tree, a model raorm has
      # never seen, and the five-line main a real user writes.
      #
      # With RAORM_DSN set (this job has one) it also walks the migration
      # path — diff, apply with a runner of its own, verify — which is the
      # riskiest thing an ORM does and had only ever been exercised from
      # inside this module.
      - name: outsider
        run: ./scripts/check/outsider.sh

      # -race catches the shape cache and binder pool; -shuffle catches tests
      # that only pass in declaration order.
      - name: test
        run: go test -race -shuffle=on ./...

      # Not a perf gate: it fails only if a benchmark stops compiling or
      # errors, which is how benchmark rot usually starts.
      - name: benchmarks compile and run
        run: go test -run XXX -bench . -benchtime=1x ./bench/

      # The seed corpus runs as an ordinary test above; this is the part that
      # searches. Short on every PR because a fuzzer that only runs nightly
      # finds its bugs a day after the commit that caused them.
      #
      # It has already earned this: 20 seconds found a stream whose WHERE
      # clause was silently dropped while NArg still counted the dropped
      # predicates — a filter that failed OPEN.
      - name: fuzz the compiler
        run: |
          go test ./runtime/ -run XXX -fuzz FuzzSpliceTree -fuzztime 60s
          go test ./runtime/ -run XXX -fuzz FuzzSpliceSections -fuzztime 30s
          go test ./compile/pgsql/ -run XXX -fuzz FuzzIdent -fuzztime 30s

      # A REACHABLE vulnerability fails the build; "required but not called"
      # is reported and tolerated (Ent's toolchain drags modules nothing here
      # executes). The first run of this found x/text's norm reachable through
      # pgx's SCRAM path on every connect — found by scanning, not by luck.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # Coverage floors, per profile, from AGENTS.md. A floor rather than a
      # target: it stops coverage falling silently, and says nothing about
      # whether the tests are good.
      - name: coverage floors
        run: ./scripts/check/coverage.sh
