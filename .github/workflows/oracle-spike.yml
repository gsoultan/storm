# M11: the estimate, and the gate it grew into.
#
# It started as a MEASUREMENT — three questions asked before M11 began. It is
# now also where compile/oraddl's output is carried to a real server, the same
# way internal/mssqlspike became scripts/check/mssql.sh. A workflow of its own,
# triggered on the packages it covers rather than on every push, because Oracle
# Free is a big image; when the back end is complete this moves into ci.yml
# beside the sqlserver job.
#
# Oracle Free is a big image and takes a minute or two to open. That cost is
# worth paying when the spike changes and is worth paying never otherwise.
name: oracle-spike

on:
  workflow_dispatch:
  push:
    paths:
      - 'internal/oraclespike/**'
      - 'compile/oraddl/**'
      - 'compile/oracle/**'
      - 'runtime/valdec/**'
      - 'runtime/sqldrv/**'
      - 'schema/oracle/**'
      - 'tool/oratool/**'
      - 'migrate/**'
      - '.github/workflows/oracle-spike.yml'

jobs:
  spike:
    runs-on: ubuntu-latest
    services:
      oracle:
        # gvenzl/oracle-free is multi-arch from 23.5, so this is the SAME
        # engine a developer runs on Apple silicon — unlike SQL Server, where
        # CI runs the real image and a laptop runs Azure SQL Edge at the 2019
        # level. There is nothing to caveat here.
        image: gvenzl/oracle-free:slim
        env:
          ORACLE_PASSWORD: Storm1Passw0rd
          # A NORMAL user in a NORMAL tablespace, not SYSTEM. The native JSON
          # type is ORA-43853 in a tablespace without automatic segment space
          # management, and SYSTEM is exactly that — so connecting as `system`
          # made a type storm generates unusable for a reason no real
          # deployment would hit. gvenzl/oracle-free creates APP_USER in USERS.
          APP_USER: storm
          APP_USER_PASSWORD: Storm1Passw0rd
        ports: ["1521:1521"]
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 20s
          --health-timeout 10s
          --health-retries 30
    env:
      STORM_ORACLE_DSN: oracle://storm:Storm1Passw0rd@127.0.0.1:1521/FREEPDB1
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      # Result 1 and 3: what the engine has, and what empty-string-is-NULL
      # actually breaks. -v because the answers are in the log lines, not in
      # the pass/fail: a spike reports, a gate refuses.
      # Result 1 and 3, and — since M11 started — the DDL compile/oraddl emits,
      # APPLIED. P6.7: a generator that agrees with itself proves nothing.
      - name: what Oracle has, what it means, and whether storm's SQL runs
        run: cd internal/oraclespike && go test -count=1 -v ./...

      # The whole stack: model → generator → generated package → runtime/sqldrv
      # → go-ora → Oracle. P6.7 one level up from the lowering gate — that one
      # proves storm's SQL runs, this proves the CODE storm writes runs, which
      # is a different claim and the one an adopter cares about.
      #
      # It generates into the spike module rather than storm's, because running
      # needs go-ora and storm's go.mod does not have it.
      # The packages whose live half only runs where there is an Oracle. Their
      # floors are here rather than in scripts/check/coverage.sh for the reason
      # the SQL Server ones are in scripts/check/mssql.sh: measured without a
      # server, they would be measuring a suite that skipped.
      - name: the Oracle packages are above their floors
        run: |
          fail=0
          cov() {
            pct=$(go test -count=1 -cover "$1" 2>/dev/null |
              sed -n 's/.*coverage: \([0-9.]*\)%.*/\1/p')
            if [ -z "$pct" ]; then
              echo "  $1 reported no coverage at all, so its tests did not run" >&2
              fail=1; return
            fi
            ok=$(awk -v a="$pct" -v b="$2" 'BEGIN{print (a+0 >= b+0) ? "ok" : "low"}')
            printf '  %-34s %6s%%  floor %s%%  %s\n' "$1" "$pct" "$2" "$ok"
            [ "$ok" = "ok" ] || fail=1
          }
          # Every number here is just under a MEASURED one, taken on the run
          # that added these floors. The first attempt guessed them and all six
          # were wrong — which is the same mistake tool/mstool's floor recorded
          # a fortnight earlier, made again by the person who wrote that note.
          cov ./compile/oraddl 90   # 93.1
          cov ./compile/oracle 70   # 74.3 — see below
          cov ./runtime/valdec 70   # 75.0
          cov ./runtime/sqldrv 65   # 68.7
          cov ./schema/oracle 88    # 91.6
          cov ./tool/oratool 35     # 35.7 — see below
          exit "$fail"
          #
          # TWO OF THESE ARE LOWER THAN THEIR SIBLINGS, and both for the same
          # structural reason rather than for want of tests.
          #
          # compile/oracle is 74 where compile/mssql is 95, because a large part
          # of its expression writer and its declared reads are exercised by
          # internal/oraclespike — a SEPARATE MODULE, whose coverage does not
          # count here. The code is run; it is run from somewhere that cannot
          # be measured from.
          #
          # tool/oratool is 36 because ImportModel's only non-refusal path
          # needs a server, and the tests that give it one are in that same
          # separate module. The refusals an adopter meets first ARE covered,
          # which is what this floor protects.

      - name: the generated package RUNS
        run: cd internal/oraclespike && go test -count=1 -v -timeout 300s -run TestTheGeneratedOraclePackageRuns ./...

      # Result 2: what a database/sql Oracle driver costs per row. The same
      # measurement M9 and M10 took, which is what decides whether M11 is a
      # lowering or a lowering plus a client.
      - name: what the driver costs per row
        if: always() # the measurement is wanted even when a probe reported NO
        run: cd internal/oraclespike && go test -count=1 -run XXX -bench . -benchtime 30x ./...
