# M11: the estimate, and the gate it grew into.
#
# It started as a MEASUREMENT — three questions asked before M11 began. It is
# now also where compile/oraddl's output is carried to a real server, the same
# way internal/mssqlspike became scripts/check/mssql.sh. A workflow of its own,
# triggered on the packages it covers rather than on every push, because Oracle
# Free is a big image; when the back end is complete this moves into ci.yml
# beside the sqlserver job.
#
# Oracle Free is a big image and takes a minute or two to open. That cost is
# worth paying when the spike changes and is worth paying never otherwise.
name: oracle-spike

on:
  workflow_dispatch:
  push:
    paths:
      - 'internal/oraclespike/**'
      - 'compile/oraddl/**'
      - 'compile/oracle/**'
      - '.github/workflows/oracle-spike.yml'

jobs:
  spike:
    runs-on: ubuntu-latest
    services:
      oracle:
        # gvenzl/oracle-free is multi-arch from 23.5, so this is the SAME
        # engine a developer runs on Apple silicon — unlike SQL Server, where
        # CI runs the real image and a laptop runs Azure SQL Edge at the 2019
        # level. There is nothing to caveat here.
        image: gvenzl/oracle-free:slim
        env:
          ORACLE_PASSWORD: Storm1Passw0rd
          # A NORMAL user in a NORMAL tablespace, not SYSTEM. The native JSON
          # type is ORA-43853 in a tablespace without automatic segment space
          # management, and SYSTEM is exactly that — so connecting as `system`
          # made a type storm generates unusable for a reason no real
          # deployment would hit. gvenzl/oracle-free creates APP_USER in USERS.
          APP_USER: storm
          APP_USER_PASSWORD: Storm1Passw0rd
        ports: ["1521:1521"]
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 20s
          --health-timeout 10s
          --health-retries 30
    env:
      STORM_ORACLE_DSN: oracle://storm:Storm1Passw0rd@127.0.0.1:1521/FREEPDB1
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      # Result 1 and 3: what the engine has, and what empty-string-is-NULL
      # actually breaks. -v because the answers are in the log lines, not in
      # the pass/fail: a spike reports, a gate refuses.
      # Result 1 and 3, and — since M11 started — the DDL compile/oraddl emits,
      # APPLIED. P6.7: a generator that agrees with itself proves nothing.
      - name: what Oracle has, what it means, and whether storm's SQL runs
        run: cd internal/oraclespike && go test -count=1 -v ./...

      # Result 2: what a database/sql Oracle driver costs per row. The same
      # measurement M9 and M10 took, which is what decides whether M11 is a
      # lowering or a lowering plus a client.
      - name: what the driver costs per row
        if: always() # the measurement is wanted even when a probe reported NO
        run: cd internal/oraclespike && go test -count=1 -run XXX -bench . -benchtime 30x ./...
